name: tv_spelling_game
description: "A D-pad accessible kids spelling and unscramble game for Android TV."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  qr_flutter: ^4.1.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  flutter_tts: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
